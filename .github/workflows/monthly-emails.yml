name: Monthly customer emails

on:
  schedule:
    # Every Monday, 14:00 UTC — one hour after generate.yml's regen. Both
    # send-monthly-emails.js and send-reminder-emails.js decide internally
    # whether today is actually their day (first/third Monday of the
    # month, plus this cycle's transition dates — see
    # generator/lib/emailSchedule.js), since cron can't express "Nth
    # Monday" directly. A scheduled run always attempts both; on most
    # Mondays neither one does anything.
    - cron: "0 14 * * 1"
    # One-time: the November send was moved to Nov 3 from 10:00 ET (15:00 UTC)
    # because the Nov 2 run never started. GitHub can start a scheduled run
    # hours late, so this fires hourly through the day; the send script only
    # sends from 15:00 UTC and once a month (a run that finds the month already
    # sent exits quietly), and the concurrency group below keeps runs from
    # overlapping. Harmless to leave: it never matches again.
    - cron: "0 15-23 3 11 *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which email to send"
        required: true
        type: choice
        options:
          - send
          - remind
          - test
          - test-remind
          - validate-roundtrip
          - preview-skips

permissions:
  contents: write

# One email run at a time. A second run waits for the first to finish and
# commit its thread state, so it sees that the month was already sent.
concurrency:
  group: monthly-emails
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Send monthly links
        if: steps.mode.outputs.mode == 'send' || steps.mode.outputs.mode == 'auto'
        run: node generator/send-monthly-emails.js
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          PORTAL_SLUG_SECRET: ${{ secrets.PORTAL_SLUG_SECRET }}
          CUSTOMER_SHEET_ID: ${{ vars.CUSTOMER_SHEET_ID }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Preview who would be skipped (sends nothing)
        if: steps.mode.outputs.mode == 'preview-skips'
        run: node generator/send-monthly-emails.js
        env:
          DRY_RUN: "1"
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          PORTAL_SLUG_SECRET: ${{ secrets.PORTAL_SLUG_SECRET }}
          CUSTOMER_SHEET_ID: ${{ vars.CUSTOMER_SHEET_ID }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}

      - name: Commit thread state
        if: always() && (steps.mode.outputs.mode == 'send' || steps.mode.outputs.mode == 'auto')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p state
          git add state/
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "Record email thread state for $(date +%Y-%m)"
          git pull --rebase origin main
          git push

      - name: Send reminders
        if: steps.mode.outputs.mode == 'remind' || steps.mode.outputs.mode == 'auto'
        run: node generator/send-reminder-emails.js
        env:
          PORTAL_SLUG_SECRET: ${{ secrets.PORTAL_SLUG_SECRET }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}

      - name: Send test email
        if: steps.mode.outputs.mode == 'test'
        run: node generator/send-test-email.js
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_EMAIL_TO: ${{ vars.TEST_EMAIL_TO }}

      - name: Send test reminder
        if: steps.mode.outputs.mode == 'test-remind'
        run: node generator/send-test-reminder.js
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          TEST_EMAIL_TO: ${{ vars.TEST_EMAIL_TO }}
          TEST_THREAD_ID: ${{ vars.TEST_THREAD_ID }}

      - name: "Roundtrip: write dry-run state"
        if: steps.mode.outputs.mode == 'validate-roundtrip'
        run: node generator/write-dryrun-state.js
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_EMAIL_TO: ${{ vars.TEST_EMAIL_TO }}

      - name: "Roundtrip: commit dry-run state"
        if: steps.mode.outputs.mode == 'validate-roundtrip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/email-threads/_dryrun.json
          git commit -m "Roundtrip validation: write dry-run thread state"
          git push

      - name: "Roundtrip: read state back and reply"
        if: steps.mode.outputs.mode == 'validate-roundtrip'
        run: node generator/read-dryrun-state.js
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}

      - name: "Roundtrip: clean up dry-run state"
        if: always() && steps.mode.outputs.mode == 'validate-roundtrip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch state/email-threads/_dryrun.json
          git diff --cached --quiet && echo "Nothing to clean up" || git commit -m "Roundtrip validation: clean up dry-run thread state"
          git push

      - name: Notify Slack on failure
        if: failure() || cancelled()
        run: |
          curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"text\": \":rotating_light: *monthly-emails.yml failed* (mode: ${{ steps.mode.outputs.mode }}) on run <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>.\"}" \
            "$SLACK_WEBHOOK_URL"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
