name: Generate & deploy wholesale portal

on:
  schedule:
    # Every Monday, 13:00 UTC (09:00 ET). generate.js itself decides
    # whether today is an actual send day (first Monday of the month, plus
    # this cycle's transition dates - see generator/lib/emailSchedule.js)
    # and no-ops otherwise, since cron can't express "Nth Monday" directly.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Generate customer pages
        id: generate
        run: node generator/generate.js
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          PORTAL_SLUG_SECRET: ${{ secrets.PORTAL_SLUG_SECRET }}
          PRICING_SHEET_ID: ${{ vars.PRICING_SHEET_ID }}
          CUSTOMER_SHEET_ID: ${{ vars.CUSTOMER_SHEET_ID }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}

      - name: Upload customer link manifest
        if: steps.generate.outputs.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: customer-manifest
          path: deploy/_manifest.csv

      - name: Deploy to Vercel
        if: steps.generate.outputs.skipped != 'true'
        run: |
          npm i -g vercel@latest
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" --cwd deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Notify Slack on failure
        if: failure() || cancelled()
        run: |
          curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"text\": \":rotating_light: *generate.yml failed* on run <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}> (${{ github.event_name }}).\"}" \
            "$SLACK_WEBHOOK_URL"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
